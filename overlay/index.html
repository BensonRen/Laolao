<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laolao Captions</title>
  <style>
    @font-face {
      font-family: 'NotoSansSC';
      src: local('Noto Sans SC'),
           local('NotoSansSC'),
           local('华文黑体'),
           local('STHeiti'),
           local('Microsoft YaHei'),
           local('微软雅黑');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-size: 72px;
      --bg: rgba(0, 0, 0, 0.72);
      --color-final: #ffffff;
      --color-partial: #ffe066;
      --padding: 24px 36px;
      --border-radius: 16px;
      --fade-ms: 4000;
      --transition: 0.25s ease;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* Portrait preview mode: constrains to 9:16 centered in the browser tab */
    body.portrait-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    body.portrait-preview #viewport {
      position: relative;
      /* On a landscape monitor: width is the limiting axis (9/16 of height) */
      width: min(calc(100vh * 9 / 16), 100vw);
      height: min(calc(100vw * 16 / 9), 100vh);
      overflow: hidden;
      flex-shrink: 0;
    }

    body.portrait-preview #camera,
    body.portrait-preview #picker,
    body.portrait-preview #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    body.portrait-preview #stage {
      height: auto;
      top: auto;
      bottom: 60px;
      left: 5%;
      right: 5%;
      width: auto;
    }

    /* ── Camera feed ── */
    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Camera picker UI (shown until camera is selected) ── */
    #picker {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
      z-index: 100;
    }

    #picker h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    #picker p {
      font-size: 15px;
      color: #aaa;
    }

    #cam-select {
      font-size: 17px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #1c1c1e;
      color: #fff;
      min-width: 320px;
      cursor: pointer;
    }

    #cam-select option { background: #1c1c1e; }

    #start-btn {
      font-size: 17px;
      padding: 12px 40px;
      border-radius: 10px;
      border: none;
      background: #0a84ff;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    #start-btn:hover { background: #0071e3; }

    #picker.hidden { display: none; }

    /* ── Caption stage ── */
    #stage {
      position: fixed;
      bottom: 60px;
      left: 5%;
      right: 5%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }

    .line {
      display: inline-block;
      max-width: 100%;
      background: var(--bg);
      color: var(--color-final);
      font-family: 'NotoSansSC', 'Noto Sans SC', 'PingFang SC', '华文黑体',
                   'STHeiti', 'Microsoft YaHei', '微软雅黑',
                   'Hiragino Sans GB', sans-serif;
      font-size: var(--font-size);
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.02em;
      padding: var(--padding);
      border-radius: var(--border-radius);
      word-break: break-all;
      opacity: 1;
      transition: opacity var(--transition), transform var(--transition);
      transform: translateY(0);
    }

    .line.partial { color: var(--color-partial); }

    .line.fading {
      opacity: 0;
      transform: translateY(-8px);
    }

    /* ── Debug panel ── */
    #hud {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 200;
      display: flex;
      gap: 6px;
      pointer-events: all;
    }

    #hud button {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #hud button:hover { background: rgba(0,0,0,0.8); }
    #hud button.active { border-color: #0a84ff; color: #0a84ff; }

    #debug-panel {
      position: fixed;
      top: 44px;
      right: 14px;
      z-index: 200;
      background: rgba(0,0,0,0.82);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 14px 18px;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 12px;
      color: #e0e0e0;
      min-width: 240px;
      backdrop-filter: blur(10px);
      line-height: 1.9;
      pointer-events: all;
    }
    #debug-panel.hidden { display: none; }

    #debug-panel .section {
      color: #888;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 10px;
      margin-bottom: 2px;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 8px;
    }
    #debug-panel .section:first-child { margin-top: 0; border-top: none; padding-top: 0; }

    #debug-panel .row { display: flex; justify-content: space-between; gap: 16px; }
    #debug-panel .label { color: #888; }
    #debug-panel .val { color: #fff; font-weight: 600; }
    #debug-panel .val.good { color: #30d158; }
    #debug-panel .val.warn { color: #ffd60a; }
    #debug-panel .val.bad  { color: #ff453a; }

    /* ── OBS chroma key mode ── */
    body.chromakey { background: #00ff00; }
    body.chromakey #camera { display: none; }
    body.chromakey .line {
      background: transparent;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9), -1px -1px 4px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

<div id="hud">
  <button id="portrait-toggle">9:16</button>
  <button id="debug-toggle">Stats</button>
</div>
<div id="debug-panel" class="hidden">
  <div class="section">Connection</div>
  <div class="row"><span class="label">Status</span><span class="val" id="db-ws-status">–</span></div>
  <div class="row"><span class="label">Reconnects</span><span class="val" id="db-reconnects">0</span></div>

  <div class="section">Server</div>
  <div class="row"><span class="label">Backend</span><span class="val" id="db-backend">–</span></div>
  <div class="row"><span class="label">Model</span><span class="val" id="db-model">–</span></div>
  <div class="row"><span class="label">Language</span><span class="val" id="db-lang">–</span></div>
  <div class="row"><span class="label">Uptime</span><span class="val" id="db-uptime">–</span></div>

  <div class="section">Transcriptions</div>
  <div class="row"><span class="label">Partials</span><span class="val" id="db-partials">0</span></div>
  <div class="row"><span class="label">Finals</span><span class="val" id="db-finals">0</span></div>
  <div class="row"><span class="label">Rejected</span><span class="val" id="db-rejected">0</span></div>

  <div class="section">Latency (last 50)</div>
  <div class="row"><span class="label">Last</span><span class="val" id="db-lat-last">–</span></div>
  <div class="row"><span class="label">Avg</span><span class="val" id="db-lat-avg">–</span></div>
  <div class="row"><span class="label">Min / Max</span><span class="val" id="db-lat-minmax">–</span></div>
</div>

<div id="viewport">
<video id="camera" autoplay playsinline muted></video>

<!-- Camera selection UI -->
<div id="picker">
  <h1>老老 Laolao</h1>
  <p>Select the camera to use for captions</p>
  <select id="cam-select"><option value="">Loading cameras…</option></select>
  <button id="start-btn">Start</button>
</div>

<div id="stage"></div>
</div><!-- #viewport -->

<script>
// ─── URL parameter overrides ───────────────────────────────────
const params = new URLSearchParams(location.search);

const FONT_SIZE  = params.get('fontsize') || '72';
const BG_COLOR   = params.get('bg')       || 'rgba(0,0,0,0.72)';
const WS_PORT    = params.get('port')     || '8765';
const MAX_LINES  = parseInt(params.get('maxlines') || '3', 10);
const FADE_MS    = parseInt(params.get('fadems')   || '4000', 10);
const CHROMA_KEY = params.has('chromakey');
const PORTRAIT   = params.has('portrait');

document.documentElement.style.setProperty('--font-size', FONT_SIZE + 'px');
document.documentElement.style.setProperty('--bg', BG_COLOR);
document.documentElement.style.setProperty('--fade-ms', FADE_MS + 'ms');
if (CHROMA_KEY) document.body.classList.add('chromakey');
if (PORTRAIT)   document.body.classList.add('portrait-preview');

// ─── Camera setup ──────────────────────────────────────────────
const camVideo   = document.getElementById('camera');
const picker     = document.getElementById('picker');
const camSelect  = document.getElementById('cam-select');
const startBtn   = document.getElementById('start-btn');

const SAVED_CAM_KEY = 'laolao_camera_id';

async function populateCameras() {
  // Need a temporary stream to prompt permission before enumerateDevices returns labels
  let tempStream = null;
  try {
    tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  } catch (e) {
    camSelect.innerHTML = '<option value="">Camera permission denied</option>';
    return;
  }

  const devices = await navigator.mediaDevices.enumerateDevices();
  const cameras = devices.filter(d => d.kind === 'videoinput');

  tempStream.getTracks().forEach(t => t.stop());

  camSelect.innerHTML = '';
  const savedId = localStorage.getItem(SAVED_CAM_KEY);

  cameras.forEach((cam, i) => {
    const opt = document.createElement('option');
    opt.value = cam.deviceId;
    opt.textContent = cam.label || `Camera ${i + 1}`;
    if (cam.deviceId === savedId) opt.selected = true;
    camSelect.appendChild(opt);
  });

  if (!cameras.length) {
    camSelect.innerHTML = '<option value="">No cameras found</option>';
  }
}

async function startCamera(deviceId) {
  const constraints = {
    video: deviceId ? { deviceId: { exact: deviceId } } : true,
    audio: false,
  };
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  camVideo.srcObject = stream;
  localStorage.setItem(SAVED_CAM_KEY, deviceId);
  picker.classList.add('hidden');
}

startBtn.addEventListener('click', () => {
  const deviceId = camSelect.value;
  startCamera(deviceId).catch(err => {
    alert('Could not start camera: ' + err.message);
  });
});

// Auto-start with saved camera if available
async function init() {
  await populateCameras();
  const savedId = localStorage.getItem(SAVED_CAM_KEY);
  if (savedId && camSelect.querySelector(`option[value="${savedId}"]`)) {
    startCamera(savedId).catch(() => {});
  }
}

init();

// ─── Caption state ─────────────────────────────────────────────
const stage = document.getElementById('stage');
let partialEl = null;
let finalLines = [];

function createLine(text, isPartial) {
  const el = document.createElement('div');
  el.className = 'line' + (isPartial ? ' partial' : '');
  el.textContent = text;
  return el;
}

function addFinalLine(text) {
  if (partialEl) { stage.removeChild(partialEl); partialEl = null; }

  const el = createLine(text, false);
  stage.appendChild(el);

  while (finalLines.length >= MAX_LINES) {
    const oldest = finalLines.shift();
    clearTimeout(oldest.fadeTimer);
    if (oldest.el.parentNode) stage.removeChild(oldest.el);
  }

  const fadeTimer = setTimeout(() => fadeLine(el), FADE_MS);
  finalLines.push({ el, fadeTimer });
}

function fadeLine(el) {
  el.classList.add('fading');
  setTimeout(() => {
    if (el.parentNode) stage.removeChild(el);
    finalLines = finalLines.filter(l => l.el !== el);
  }, 300);
}

function setPartial(text) {
  if (!partialEl) {
    partialEl = createLine(text, true);
    stage.appendChild(partialEl);
  } else {
    partialEl.textContent = text;
  }
}

// ─── Portrait toggle ───────────────────────────────────────────
const portraitBtn = document.getElementById('portrait-toggle');
const PORTRAIT_KEY = 'laolao_portrait';

function applyPortrait(on) {
  document.body.classList.toggle('portrait-preview', on);
  portraitBtn.classList.toggle('active', on);
  localStorage.setItem(PORTRAIT_KEY, on ? '1' : '');
}

portraitBtn.addEventListener('click', () => {
  applyPortrait(!document.body.classList.contains('portrait-preview'));
});

// Restore saved state (URL param OR localStorage)
applyPortrait(PORTRAIT || !!localStorage.getItem(PORTRAIT_KEY));

// ─── Debug panel ───────────────────────────────────────────────
const debugToggle = document.getElementById('debug-toggle');
const debugPanel  = document.getElementById('debug-panel');
debugToggle.addEventListener('click', () => debugPanel.classList.toggle('hidden'));
document.addEventListener('keydown', e => { if (e.key === 'd') debugPanel.classList.toggle('hidden'); });

function $d(id) { return document.getElementById(id); }

function setVal(id, text, cls) {
  const el = $d(id);
  el.textContent = text;
  el.className = 'val' + (cls ? ' ' + cls : '');
}

function fmtUptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
}

function fmtLat(ms) {
  if (ms == null) return '–';
  const cls = ms < 500 ? 'good' : ms < 1500 ? 'warn' : 'bad';
  return [ms + ' ms', cls];
}

let wsReconnects = -1; // first connect doesn't count

function updateDebugStats(s) {
  const t = s.transcriptions;
  setVal('db-backend', s.backend || '–');
  setVal('db-model',   s.model   || '–');
  setVal('db-lang',    s.language || '–');
  setVal('db-uptime',  fmtUptime(s.uptime_s || 0));
  setVal('db-partials',  t.partials);
  setVal('db-finals',    t.finals);
  setVal('db-rejected',  t.rejected, t.rejected > 0 ? 'warn' : '');
  const l = s.latency_ms;
  const [lastTxt, lastCls] = fmtLat(l.last);
  const [avgTxt,  avgCls]  = fmtLat(l.avg);
  setVal('db-lat-last',   lastTxt, lastCls);
  setVal('db-lat-avg',    avgTxt,  avgCls);
  setVal('db-lat-minmax', l.min != null ? `${l.min} / ${l.max} ms` : '–');
}

// ─── WebSocket connection with auto-reconnect ──────────────────
let ws = null;
let reconnectDelay = 1000;

function connect() {
  const url = `ws://localhost:${WS_PORT}`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    reconnectDelay = 1000;
    wsReconnects++;
    setVal('db-ws-status', '● Connected', 'good');
    setVal('db-reconnects', wsReconnects);
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    if (msg.type === 'stats') {
      updateDebugStats(msg);
      return;
    }

    const text = (msg.text || '').trim();
    if (!text) return;

    if (msg.type === 'partial') {
      setPartial(text);
    } else if (msg.type === 'final') {
      addFinalLine(text);
    } else if (msg.type === 'clear') {
      if (partialEl) { stage.removeChild(partialEl); partialEl = null; }
      finalLines.forEach(l => { clearTimeout(l.fadeTimer); stage.removeChild(l.el); });
      finalLines = [];
    }
  };

  ws.onerror = (e) => console.warn('[laolao] WS error', e);

  ws.onclose = () => {
    ws = null;
    setVal('db-ws-status', '○ Disconnected', 'bad');
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
  };
}

connect();
</script>
</body>
</html>
