<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Whisper large-v3-turbo, time to transcribe a 4-second utterance, greedy versus beam 4</title>
  <style>
    .t { fill: #3a2f2a; font-size: 13px; }
    .m { fill: #7a6c64; font-size: 12px; }
    .h { fill: #1f1a17; font-size: 15px; font-weight: 600; }
    .n { fill: #1f1a17; font-size: 12px; font-variant-numeric: tabular-nums; }
    .grid { stroke: #e6ddd4; stroke-width: 1; }
    .axis { stroke: #b9aca2; stroke-width: 1; }
    .greedy { fill: #e8b39a; }
    .beam { fill: #c8321f; }
    .budget { stroke: #2e6b3f; stroke-width: 1.5; stroke-dasharray: 5 4; }
  </style>
  <rect width="760" height="330" fill="#fbf8f4"/>
  <text x="24" y="30" class="h">Time to transcribe a 4 s utterance, whisper-large-v3-turbo</text>
  <text x="24" y="50" class="m">Median of three runs on the AISHELL-1 fixtures. Finals use beam 4; partials stay greedy.</text>

  <!-- plot area: x 170..720, y 80..270 ; scale 0..1400 ms -->
  <g>
    <line x1="170" y1="270" x2="720" y2="270" class="axis"/>
    <g class="m">
      <line x1="170" y1="80" x2="170" y2="270" class="grid"/>
      <line x1="288" y1="80" x2="288" y2="270" class="grid"/><text x="288" y="288" text-anchor="middle">300 ms</text>
      <line x1="406" y1="80" x2="406" y2="270" class="grid"/><text x="406" y="288" text-anchor="middle">600 ms</text>
      <line x1="524" y1="80" x2="524" y2="270" class="grid"/><text x="524" y="288" text-anchor="middle">900 ms</text>
      <line x1="641" y1="80" x2="641" y2="270" class="grid"/><text x="641" y="288" text-anchor="middle">1200 ms</text>
    </g>
    <!-- 1 s partial budget, 2 s final budget is off-chart -->
    <line x1="563" y1="76" x2="563" y2="270" class="budget"/>
    <text x="568" y="90" fill="#2e6b3f" font-size="12">1 s partial budget</text>
  </g>

  <!-- Snapdragon X2 Elite, Hexagon NPU: 457 / 856 -->
  <g>
    <text x="160" y="112" text-anchor="end" class="t">Snapdragon X2 Elite</text>
    <text x="160" y="128" text-anchor="end" class="m">Hexagon NPU</text>
    <rect x="170" y="98" width="179" height="14" class="greedy"/><text x="355" y="110" class="n">457</text>
    <rect x="170" y="116" width="336" height="14" class="beam"/><text x="512" y="128" class="n">856</text>
  </g>
  <!-- Apple Silicon, MLX: 368 / 797 -->
  <g>
    <text x="160" y="172" text-anchor="end" class="t">Apple Silicon</text>
    <text x="160" y="188" text-anchor="end" class="m">MLX</text>
    <rect x="170" y="158" width="144" height="14" class="greedy"/><text x="320" y="170" class="n">368</text>
    <rect x="170" y="176" width="313" height="14" class="beam"/><text x="489" y="188" class="n">797</text>
  </g>
  <!-- Snapdragon X2 Elite, ONNX CPU, whisper-base: 911 / 1314 -->
  <g>
    <text x="160" y="232" text-anchor="end" class="t">Snapdragon X2 Elite</text>
    <text x="160" y="248" text-anchor="end" class="m">CPU fallback, whisper-base</text>
    <rect x="170" y="218" width="358" height="14" class="greedy"/><text x="534" y="230" class="n">911</text>
    <rect x="170" y="236" width="516" height="14" class="beam"/><text x="692" y="248" class="n">1314</text>
  </g>

  <!-- legend -->
  <g transform="translate(24, 305)">
    <rect x="0" y="-10" width="14" height="12" class="greedy"/><text x="20" y="0" class="t">greedy (beam 1)</text>
    <rect x="130" y="-10" width="14" height="12" class="beam"/><text x="150" y="0" class="t">beam 4</text>
    <text x="220" y="0" class="m">Beam 4 costs 1.4–2.2×, not 4×: turbo has a 4-layer decoder and the encoder runs once.</text>
  </g>
</svg>
