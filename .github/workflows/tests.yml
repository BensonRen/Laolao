name: tests

# The fast suite: no model download, no microphone, no GPU or NPU. It covers
# the caption engine, the shared beam search (against a scripted toy model),
# the VAD, and the backend import/availability probes.
#
# The Windows runner is x64, which quietly gives that platform the unit-test
# coverage it has no dedicated machine for. The Snapdragon NPU lane can only be
# verified on real hardware with tests/acceptance_arm64.py.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PortAudio is what sounddevice links against; the Linux runner has none.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q portaudio19-dev

      # Only what the fast suite imports. The full requirements pull torch and
      # faster-whisper, which is minutes of download for tests that never run
      # inference.
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy sounddevice websockets opencc-python-reimplemented Pillow onnxruntime pytest

      - name: Fixtures (synthetic only, no network audio)
        run: python tests/generate_test_audio.py --no-download

      # Two files are end-to-end diagnostics for a real machine, not unit tests,
      # and can only fail on a hosted runner:
      #   test_windows_headless.py  asserts a full x64 install (faster-whisper,
      #                             pyvirtualcam import) — run after setup.bat
      #   test_virtualcam_macos.py  captures frames from the OBS camera
      #                             extension, which needs the driver installed
      #                             and a GUI session — run on a Mac with OBS
      - name: Fast suite
        run: >
          python -m pytest tests/ -m "not slow" -q
          --ignore=tests/test_windows_headless.py
          --ignore=tests/test_virtualcam_macos.py
